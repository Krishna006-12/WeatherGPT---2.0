<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="65%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Lightning Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Neural Network Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" />

  <!-- Atmospheric Radar Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(6, 182, 212, 0.12)" stroke-width="1.5" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(168, 85, 247, 0.15)" stroke-width="2" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Main Weather Cloud Shape (Neon Glow) -->
  <g filter="url(#neonGlow)">
    <!-- Weather Cloud Contour -->
    <path
      d="M 180 340 
         L 332 340 
         A 48 48 0 0 0 380 292 
         A 44 44 0 0 0 365 249 
         A 64 64 0 0 0 310 190 
         A 76 76 0 0 0 205 190 
         A 60 60 0 0 0 148 250 
         A 52 52 0 0 0 180 340 Z"
      fill="none"
      stroke="url(#cloudGrad)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Secondary Ambient Flow Line -->
    <path
      d="M 160 300 
         A 35 35 0 0 1 190 250 
         A 50 50 0 0 1 270 215 
         A 40 40 0 0 1 340 270"
      fill="none"
      stroke="rgba(168, 85, 247, 0.45)"
      stroke-width="6"
      stroke-linecap="round"
    />
  </g>

  <!-- Neural GPT Mesh Nodes & Interconnects -->
  <g filter="url(#subtleGlow)">
    <!-- Connection lines between AI nodes -->
    <line x1="205" y1="240" x2="238" y2="282" stroke="rgba(56, 189, 248, 0.6)" stroke-width="3" />
    <line x1="205" y1="240" x2="274" y2="235" stroke="rgba(168, 85, 247, 0.5)" stroke-width="3" />
    <line x1="305" y1="275" x2="274" y2="235" stroke="rgba(56, 189, 248, 0.6)" stroke-width="3" />
    <line x1="305" y1="275" x2="335" y2="310" stroke="rgba(168, 85, 247, 0.6)" stroke-width="3" />
    <line x1="175" y1="285" x2="205" y2="240" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2.5" />
    <line x1="238" y1="282" x2="175" y2="285" stroke="rgba(168, 85, 247, 0.5)" stroke-width="2.5" />

    <!-- Neural Nodes -->
    <circle cx="205" cy="240" r="8" fill="url(#nodeGrad)" />
    <circle cx="274" cy="235" r="7" fill="url(#nodeGrad)" />
    <circle cx="238" cy="282" r="7.5" fill="url(#nodeGrad)" />
    <circle cx="175" cy="285" r="6.5" fill="url(#nodeGrad)" />
    <circle cx="305" cy="275" r="8" fill="url(#nodeGrad)" />
    <circle cx="335" cy="310" r="7" fill="url(#nodeGrad)" />
  </g>

  <!-- Central Intelligence Lightning Bolt -->
  <g filter="url(#neonGlow)">
    <polygon
      points="265,175 228,260 262,260 242,335 292,245 258,245"
      fill="url(#boltGrad)"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linejoin="round"
    />
  </g>

  <!-- Star / Sparkle Accents -->
  <circle cx="370" cy="180" r="3" fill="#67e8f9" filter="url(#subtleGlow)" />
  <circle cx="140" cy="210" r="2.5" fill="#c084fc" filter="url(#subtleGlow)" />
  <circle cx="390" cy="310" r="2" fill="#38bdf8" />
</svg>
